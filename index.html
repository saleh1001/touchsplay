<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockBot - Legal & Documentation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-primary': '#0b0f19',
            'bg-secondary': '#111827',
            'bg-card': '#1f2937',
            'text-primary': '#f9fafb',
            'text-secondary': '#9ca3af',
            'accent': '#6366f1',
            'accent-hover': '#4f46e5',
            'border': '#374151'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#0b0f19] text-[#f9fafb] font-sans flex flex-col justify-between items-center selection:bg-indigo-500/30 p-6">
  
  <div class="max-w-xl w-full mx-auto my-auto flex flex-col items-center text-center gap-6 bg-gray-900/60 border border-gray-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md">
    <div class="w-16 h-16 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl flex items-center justify-center text-indigo-400 text-2xl font-bold">
      🛡️
    </div>
    
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">BlockBot Legal Portal</h1>
      <p class="text-sm text-gray-400 leading-relaxed">
        Welcome to the official legal and policy documentation portal for BlockBot. Please choose a page below to review our terms or privacy guidelines.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 w-full mt-4">
      <a href="terms.html" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-center text-sm">
        Terms of Service
      </a>
      <a href="privacy.html" class="flex-1 py-3 px-4 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-xl transition-all border border-gray-700 text-center text-sm">
        Privacy Policy
      </a>
    </div>
  </div>

  <footer class="text-xs text-gray-500 py-4">
    © 2026 BlockBot. All Rights Reserved.
  </footer>
</body>
</html>
